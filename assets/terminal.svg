<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="100%" role="img" aria-label="HidirAi terminal">
  <defs>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#161b22"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <clipPath id="round">
      <rect x="0" y="0" width="900" height="300" rx="14"/>
    </clipPath>
  </defs>
  <style>
    .ln{font-family:Consolas,Menlo,Liberation Mono,monospace;font-size:15px;clip-path:inset(0 100% 0 0)}
    .p{fill:#3fb950}
    .o{fill:#c9d1d9}
    .a{fill:#58a6ff}
    .m{fill:#8b949e}
    .tt{font-family:Consolas,Menlo,Liberation Mono,monospace;font-size:13px;fill:#8b949e}
    .l1{animation:type .5s steps(8,end) .2s forwards}
    .l2{animation:type 1.5s steps(34,end) .9s forwards}
    .l3{animation:type .5s steps(8,end) 2.7s forwards}
    .l4{animation:type .7s steps(12,end) 3.3s forwards}
    .l5{animation:type .5s steps(8,end) 4.2s forwards}
    .l6{animation:type 1.7s steps(43,end) 4.8s forwards}
    .l7{animation:type .4s steps(3,end) 6.8s forwards}
    .cu{opacity:0;animation:blink 1s steps(1,end) 7.3s infinite}
    @keyframes type{to{clip-path:inset(0 0 0 0)}}
    @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
  </style>
  <g clip-path="url(#round)">
    <rect width="900" height="300" fill="url(#win)" stroke="#30363d" stroke-width="1.5">
      <animate attributeName="stroke" values="#30363d;#1f6feb;#30363d" dur="7s" repeatCount="indefinite"/>
    </rect>
    <circle cx="24" cy="19" r="6" fill="#ff5f56"/>
    <circle cx="46" cy="19" r="6" fill="#ffbd2e"/>
    <circle cx="68" cy="19" r="6" fill="#27c93f"/>
    <text x="96" y="24" class="tt">hidirai@telegram:~</text>
    <line x1="0" y1="38" x2="900" y2="38" stroke="#30363d" stroke-width="1"/>
    <text x="32" y="70" class="ln l1 p">$</text>
    <text x="52" y="70" class="ln l1 o">whoami</text>
    <text x="32" y="102" class="ln l2 a">HidirAi — AI assistant in Telegram</text>
    <text x="32" y="134" class="ln l3 p">$</text>
    <text x="52" y="134" class="ln l3 o">langs</text>
    <text x="32" y="166" class="ln l4 o">ru · en · tj</text>
    <text x="32" y="198" class="ln l5 p">$</text>
    <text x="52" y="198" class="ln l5 o">tools</text>
    <text x="32" y="230" class="ln l6 o">vision · image-gen · web-search · qr · mcp</text>
    <text x="32" y="262" class="ln l7 p">$</text>
    <rect x="52" y="246" width="9" height="17" class="cu" fill="#c9d1d9"/>
  </g>
</svg>
